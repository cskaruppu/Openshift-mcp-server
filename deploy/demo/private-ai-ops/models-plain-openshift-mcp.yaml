# ── bge-m3
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bge-m3-cache
  namespace: openshift-mcp
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bge-m3-predictor
  namespace: openshift-mcp
  labels:
    app.kubernetes.io/name: bge-m3
    app.kubernetes.io/part-of: tcs-private-ai
    tcs.com/demo: private-ai-ops
    tcs.com/model: bge-m3
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      tcs.com/model: bge-m3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bge-m3
        app.kubernetes.io/part-of: tcs-private-ai
        tcs.com/demo: private-ai-ops
        tcs.com/model: bge-m3
    spec:
      volumes:
      - name: cache
        persistentVolumeClaim:
          claimName: bge-m3-cache
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      containers:
      - name: model
        image: ghcr.io/huggingface/text-embeddings-inference:hopper-1.8.3
        args:
        - --model-id
        - BAAI/bge-m3
        - --port
        - '8080'
        - --served-model-name
        - bge-m3
        - --huggingface-hub-cache
        - /models-cache
        env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: HF_TOKEN
              optional: true
        - name: HOME
          value: /tmp
        ports:
        - containerPort: 8080
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 10
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 10
          failureThreshold: 60
        resources:
          requests:
            cpu: '2'
            memory: 8Gi
            nvidia.com/gpu: '1'
            nvidia.com/gpumem: '6144'
          limits:
            cpu: '8'
            memory: 16Gi
            nvidia.com/gpu: '1'
            nvidia.com/gpumem: '6144'
        volumeMounts:
        - name: cache
          mountPath: /models-cache
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: bge-m3-predictor
  namespace: openshift-mcp
  labels:
    app.kubernetes.io/name: bge-m3
    app.kubernetes.io/part-of: tcs-private-ai
    tcs.com/demo: private-ai-ops
