# ── from models/50-bge-m3.yaml
# Embeddings for incident memory: Hugging Face Text Embeddings Inference
# (Hopper build) serving BAAI/bge-m3, a 6 GB HAMi slice of one GPU. OpenAI-compatible
# /v1/embeddings; health at /health.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: bge-m3-cache, namespace: openshift-mcp }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 20Gi } }
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: bge-m3
  namespace: openshift-mcp
  labels: { opendatahub.io/dashboard: "true", tcs.com/demo: private-ai-ops }
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
    openshift.io/display-name: bge-m3
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 1
    containers:
      - name: kserve-container
        image: ghcr.io/huggingface/text-embeddings-inference:hopper-1.8.3
        args: ["--model-id", "BAAI/bge-m3", "--port", "8080", "--huggingface-hub-cache", "/models-cache"]
        env:
          - name: HF_TOKEN
            valueFrom: { secretKeyRef: { name: hf-token, key: HF_TOKEN, optional: true } }
          - { name: HOME, value: /tmp }
          - { name: CUDA_DEVICE_MEMORY_SHARED_CACHE, value: /tmp/hami-vgpu.cache }   # HAMi on OpenShift: writable place for its GPU accounting file
        ports: [{ containerPort: 8080, protocol: TCP }]
        readinessProbe: { httpGet: { path: /health, port: 8080 }, periodSeconds: 10 }
        startupProbe: { httpGet: { path: /health, port: 8080 }, periodSeconds: 10, failureThreshold: 60 }
        # HAMi (this cluster's GPU scheduler) reserves GPU memory per pod: nvidia.com/gpumem is in MiB and
        # is enforced inside the container, so vLLM sees a card of that size. Without it HAMi reserves
        # the whole card and the other models cannot be placed (CardInsufficientMemory).
        resources:
          requests: { cpu: "2", memory: 8Gi, nvidia.com/gpu: "1", nvidia.com/gpumem: "6144" }
          limits: { cpu: "8", memory: 16Gi, nvidia.com/gpu: "1", nvidia.com/gpumem: "6144" }
        volumeMounts:
          - { name: cache, mountPath: /models-cache }
    volumes:
      - { name: cache, persistentVolumeClaim: { claimName: bge-m3-cache } }
    tolerations:
      - { key: nvidia.com/gpu, operator: Exists, effect: NoSchedule }
