# GPU 1 is split with MIG into three isolated slices; GPU 0 stays whole for
# the 120B reasoning model. Two H100s, four models, no sharing surprises.
#
#   GPU 0  whole 80 GB      → gpt-oss-120b        (nvidia.com/gpu)
#   GPU 1  3g.40gb          → Llama-3.1-8B        (nvidia.com/mig-3g.40gb)
#          2g.20gb          → Qwen2.5-VL-7B       (nvidia.com/mig-2g.20gb)
#          1g.10gb (×2)     → bge-m3 embeddings   (nvidia.com/mig-1g.10gb)
#
# Apply, then (this re-partitions GPU 1 and briefly restarts GPU pods on the node):
#   oc patch clusterpolicy gpu-cluster-policy --type merge \
#     -p '{"spec":{"mig":{"strategy":"mixed"},"migManager":{"config":{"name":"tcs-mig-config","default":"all-disabled"}}}}'
#   oc label node <h100-node> nvidia.com/mig.config=tcs-demo --overwrite
#   oc get node <h100-node> -o json | jq '.status.allocatable | with_entries(select(.key|test("nvidia")))'
apiVersion: v1
kind: ConfigMap
metadata:
  name: tcs-mig-config
  namespace: nvidia-gpu-operator
data:
  config.yaml: |
    version: v1
    mig-configs:
      all-disabled:
        - devices: all
          mig-enabled: false
      tcs-demo:
        - devices: [0]
          mig-enabled: false
        - devices: [1]
          mig-enabled: true
          mig-devices:
            "3g.40gb": 1
            "2g.20gb": 1
            "1g.10gb": 2
