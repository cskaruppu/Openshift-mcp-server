# Where the models run. Separate from the platform's namespace on purpose:
# the platform's "cut the internet" switch applies to the platform, and the
# model namespace downloads weights from Hugging Face once, before the event.
apiVersion: v1
kind: Namespace
metadata:
  name: tcs-private-ai
  labels:
    opendatahub.io/dashboard: "true"     # show up in the OpenShift AI dashboard
    modelmesh-enabled: "false"
    tcs.com/demo: private-ai-ops
---
# Hugging Face token (needed for gated models such as Llama). Create it with:
#   oc -n tcs-private-ai create secret generic hf-token --from-literal=HF_TOKEN=<your token>
# This file does not contain the token.
