# Reasoning and agents: investigations, fixes, plans. MXFP4 weights, about 61 GB: it takes a 76000 MiB
# HAMi slice of one H100 (nvidia.com/gpumem below) and prefers a node away from the other demo models.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: gpt-oss-120b-cache, namespace: openshift-mcp }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 200Gi } }
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: gpt-oss-120b
  namespace: openshift-mcp
  labels: { opendatahub.io/dashboard: "true", tcs.com/demo: private-ai-ops }
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
    openshift.io/display-name: gpt-oss-120b
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 1
    containers:
      - name: kserve-container
        image: docker.io/vllm/vllm-openai:v0.11.0
        args:
            - "--model"
            - "openai/gpt-oss-120b"
            - "--served-model-name"
            - "gpt-oss-120b"
            - "--port"
            - "8080"
            - "--gpu-memory-utilization"
            - "0.92"   # of the HAMi slice below, not of the whole card
            - "--max-model-len"
            - "32768"
            - "--tool-call-parser"
            - "openai"
            - "--enable-auto-tool-choice"
        env:
          - name: HF_TOKEN
            valueFrom: { secretKeyRef: { name: hf-token, key: HF_TOKEN, optional: true } }
          - { name: HF_HOME, value: /models-cache }
          - { name: HOME, value: /tmp }
          - { name: CUDA_DEVICE_MEMORY_SHARED_CACHE, value: /tmp/hami-vgpu.cache }   # HAMi on OpenShift: writable place for its GPU accounting file
          # After the first start has cached the weights, set "1" to run with no internet at all.
          - { name: HF_HUB_OFFLINE, value: "0" }
        ports: [{ containerPort: 8080, protocol: TCP }]
        readinessProbe: { httpGet: { path: /health, port: 8080 }, periodSeconds: 10, failureThreshold: 3 }
        startupProbe: { httpGet: { path: /health, port: 8080 }, periodSeconds: 15, failureThreshold: 120 }
        # HAMi (this cluster's GPU scheduler) reserves GPU memory per pod: nvidia.com/gpumem is in MiB and
        # is enforced inside the container, so vLLM sees a card of that size. Without it HAMi reserves
        # the whole card and the other models cannot be placed (CardInsufficientMemory).
        resources:
          requests: { cpu: "4", memory: 24Gi, nvidia.com/gpu: "1", nvidia.com/gpumem: "76000" }
          limits: { cpu: "16", memory: 96Gi, nvidia.com/gpu: "1", nvidia.com/gpumem: "76000" }
        volumeMounts:
          - { name: cache, mountPath: /models-cache }
          - { name: shm, mountPath: /dev/shm }
    volumes:
      - { name: cache, persistentVolumeClaim: { claimName: gpt-oss-120b-cache } }
      - { name: shm, emptyDir: { medium: Memory, sizeLimit: 16Gi } }
    tolerations:
      - { key: nvidia.com/gpu, operator: Exists, effect: NoSchedule }
    # Prefer a node without the other demo models, but do not insist: with HAMi memory slices they can
    # safely use the free card next to it when the other node is busy.
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchExpressions:
                  - { key: serving.kserve.io/inferenceservice, operator: In, values: [llama-3-1-8b, qwen2-5-vl-7b, bge-m3] }
