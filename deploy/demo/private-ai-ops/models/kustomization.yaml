apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Sized for HAMi GPU sharing: each model reserves only the GPU memory it needs
# (nvidia.com/gpumem): gpt-oss-120b ~74 GB on one card, the three small models
# 24 + 24 + 6 GB, which fit together on another card. 10-gpu-mig.yaml is an alternative for a cluster with exactly two whole
# GPUs and no time-slicing — it re-partitions a GPU; apply it only deliberately.
# Everything goes into the existing openshift-mcp namespace; nothing here creates
# or deletes a namespace. The Hugging Face token Secret is created by hand:
#   oc -n openshift-mcp create secret generic hf-token --from-literal=HF_TOKEN=<your token>
namespace: openshift-mcp
resources:
  - 20-gpt-oss-120b.yaml
  - 30-llama-3-1-8b.yaml
  - 40-qwen2-5-vl-7b.yaml
  - 50-bge-m3.yaml
