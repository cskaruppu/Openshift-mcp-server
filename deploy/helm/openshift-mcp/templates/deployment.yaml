apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tcs-agentic-ai.fullname" . }}
  labels:
    {{- include "tcs-agentic-ai.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "tcs-agentic-ai.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tcs-agentic-ai.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "tcs-agentic-ai.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.mcp.serverPort }}
              protocol: TCP
          env:
            - name: MCP_TRANSPORT
              value: {{ .Values.mcp.transport | quote }}
            - name: MCP_SERVER_PORT
              value: {{ .Values.mcp.serverPort | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.mcp.logLevel | quote }}
            - name: ACCESS_LEVEL
              value: {{ .Values.accessLevel | quote }}
            {{- if and .Values.enabledComponents (ne .Values.enabledComponents "all") }}
            - name: ENABLED_COMPONENTS
              value: {{ .Values.enabledComponents | quote }}
            {{- end }}
            {{- if .Values.allowedNamespaces }}
            - name: ALLOWED_NAMESPACES
              value: {{ .Values.allowedNamespaces | quote }}
            {{- end }}
            {{- if .Values.openshift.apiUrl }}
            - name: OPENSHIFT_API_URL
              value: {{ .Values.openshift.apiUrl | quote }}
            {{- end }}
            {{- if .Values.openshift.token }}
            - name: OPENSHIFT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "tcs-agentic-ai.fullname" . }}-secrets
                  key: openshift-token
            {{- end }}
            {{- if .Values.llm.provider }}
            - name: LLM_PROVIDER
              value: {{ .Values.llm.provider | quote }}
            {{- end }}
            {{- if .Values.llm.apiKey }}
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "tcs-agentic-ai.fullname" . }}-secrets
                  key: llm-api-key
            {{- end }}
            {{- if .Values.llm.model }}
            - name: LLM_MODEL
              value: {{ .Values.llm.model | quote }}
            {{- end }}
            {{- if .Values.llm.apiUrl }}
            - name: LLM_API_URL
              value: {{ .Values.llm.apiUrl | quote }}
            {{- end }}
            {{- if .Values.database.url }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "tcs-agentic-ai.fullname" . }}-secrets
                  key: database-url
            {{- end }}
            {{- if .Values.redis.url }}
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "tcs-agentic-ai.fullname" . }}-secrets
                  key: redis-url
            {{- end }}
            {{- if .Values.servicenow.instance }}
            - name: SERVICENOW_INSTANCE
              value: {{ .Values.servicenow.instance | quote }}
            - name: SERVICENOW_USERNAME
              value: {{ .Values.servicenow.username | quote }}
            - name: SERVICENOW_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "tcs-agentic-ai.fullname" . }}-secrets
                  key: servicenow-password
            {{- end }}
            {{- if .Values.ansible.controllerUrl }}
            - name: ANSIBLE_CONTROLLER_URL
              value: {{ .Values.ansible.controllerUrl | quote }}
            - name: ANSIBLE_CONTROLLER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "tcs-agentic-ai.fullname" . }}-secrets
                  key: ansible-token
            {{- end }}
            {{- if .Values.otel.endpoint }}
            - name: OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            {{- if .Values.otel.headers }}
            - name: OTLP_HEADERS
              value: {{ .Values.otel.headers | quote }}
            {{- end }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.otel.serviceName | quote }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
