{{- if or .Values.openshift.token .Values.llm.apiKey .Values.database.url .Values.redis.url .Values.servicenow.password .Values.ansible.controllerToken }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tcs-agentic-ai.fullname" . }}-secrets
  labels:
    {{- include "tcs-agentic-ai.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.openshift.token }}
  openshift-token: {{ .Values.openshift.token | quote }}
  {{- end }}
  {{- if .Values.llm.apiKey }}
  llm-api-key: {{ .Values.llm.apiKey | quote }}
  {{- end }}
  {{- if .Values.database.url }}
  database-url: {{ .Values.database.url | quote }}
  {{- end }}
  {{- if .Values.redis.url }}
  redis-url: {{ .Values.redis.url | quote }}
  {{- end }}
  {{- if .Values.servicenow.password }}
  servicenow-password: {{ .Values.servicenow.password | quote }}
  {{- end }}
  {{- if .Values.ansible.controllerToken }}
  ansible-token: {{ .Values.ansible.controllerToken | quote }}
  {{- end }}
{{- end }}
