# ============================================================================
# Hub Agent — the hub cluster's own stateless MCP data-plane pod.
#
# Phase B of the stateless architecture: the hub cluster is "just another
# spoke". This pod runs the SAME image in MCP_MODE=spoke, registers with the
# control plane (agentic-ai-server) under the name "hub-cluster", and answers
# all of the hub cluster's data-plane queries through the exact same spoke
# pipeline used by every other cluster — guaranteeing identical answers.
#
# No DATABASE_URL / REDIS_URL: this pod is fully stateless.
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-hub-agent-config
  namespace: openshift-mcp
  labels:
    app.kubernetes.io/name: mcp-hub-agent
    app.kubernetes.io/part-of: tcs-agentic-ai
data:
  MCP_MODE: "spoke"
  MCP_TRANSPORT: "sse"
  MCP_SERVER_PORT: "3000"
  LOG_LEVEL: "info"
  # In-cluster service DNS — same namespace, no TLS needed.
  HUB_URL: "http://agentic-ai-server:3000"
  SPOKE_EXTERNAL_URL: "http://mcp-hub-agent:3000"
  CLUSTER_NAME: "hub-cluster"
  CLUSTER_PLATFORM: "openshift"
  AUTH_MODE: "none"
  EMERGENCY_AUTO_FIX: "false"
  ALLOW_PRIVATE_CLUSTER_IPS: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-hub-agent
  namespace: openshift-mcp
  labels:
    app.kubernetes.io/name: mcp-hub-agent
    app.kubernetes.io/component: hub-agent
    app.kubernetes.io/part-of: tcs-agentic-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-hub-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-hub-agent
        tcs.com/mcp-mode: spoke
        tcs.com/cluster-name: "hub-cluster"
    spec:
      serviceAccountName: agentic-ai-server
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp-hub-agent
          image: quay.io/karuppucs/openshift-mcp-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: mcp-hub-agent-config
          env:
            # Register with the control plane using the hub API token.
            - name: HUB_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agentic-ai-server-secrets
                  key: MCP_API_TOKEN
                  optional: true
            - name: NODE_EXTRA_CA_CERTS
              value: "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
            - name: NODE_OPTIONS
              value: "--max-old-space-size=768"
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-hub-agent
  namespace: openshift-mcp
  labels:
    app.kubernetes.io/name: mcp-hub-agent
    app.kubernetes.io/part-of: tcs-agentic-ai
spec:
  selector:
    app.kubernetes.io/name: mcp-hub-agent
  ports:
    - port: 3000
      targetPort: 3000
      name: http
