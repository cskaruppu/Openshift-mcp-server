apiVersion: v1
kind: ConfigMap
metadata:
  name: agentic-ai-server-config
  namespace: openshift-mcp
data:
  MCP_MODE: "hub"
  MCP_TRANSPORT: "sse"
  MCP_SERVER_PORT: "3000"
  LOG_LEVEL: "info"
  EMERGENCY_AUTO_FIX: "false"
  # Authentication: "none" (default), "token" (set MCP_API_TOKEN in secrets), "oauth" (OpenShift SSO)
  AUTH_MODE: "token"
  # Session timeout in seconds (default: 86400 = 24 hours)
  SESSION_TTL: "86400"
  # Password expiry in days (default: 90 days per security policy)
  PASSWORD_MAX_AGE_DAYS: "90"
  # Allow hub to connect to clusters on private IPs (10.x, 172.16-31.x, 192.168.x)
  ALLOW_PRIVATE_CLUSTER_IPS: "true"
  # Skip TLS verification for hub->spoke federation proxy calls. Spoke Routes on
  # internal/.local clusters use the router's self-signed default cert. Set to
  # "false" if all spoke Routes present certs trusted by the hub.
  FEDERATION_TLS_SKIP_VERIFY: "true"
  # DNS server for resolving spoke cluster hostnames that are outside the hub's
  # CoreDNS zone (e.g. *.apps.ocp.caaslab.local). Set to a DNS IP reachable
  # from the hub pod that can resolve spoke Route hostnames.
  SPOKE_DNS_SERVER: "10.131.19.154"
  # LLM Provider: "azure", "openai", "anthropic", "ollama", or "none" (built-in analysis)
  LLM_PROVIDER: "azure"
  # LLM_API_URL: Azure OpenAI endpoint (e.g. https://<resource>.openai.azure.com)
  # LLM_MODEL: "gpt-4"
  # AZURE_OPENAI_DEPLOYMENT: deployment name in Azure portal
  # AZURE_OPENAI_API_VERSION: "2024-12-01-preview"
  # ---- Cache & DB (optional — falls back to stateless if unset) ----
  REDIS_URL: "redis://mcp-redis.openshift-mcp.svc.cluster.local:6379"
  CHAT_CACHE_TTL: "60"
  CONTEXT_CACHE_TTL: "30"
  # ---- HTTP Proxy (route LLM calls through a machine with stable Azure access) ----
  # Set to your ansiblejenkins or proxy host. Pod → proxy → Azure.
  # HTTPS_PROXY: "http://<ansiblejenkins-ip>:8888"
  # HTTP_PROXY: "http://<ansiblejenkins-ip>:8888"
  # NO_PROXY: ".svc,.svc.cluster.local,172.30.0.0/16,10.0.0.0/8,localhost"
