apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: llm-serving
  labels: { app: vllm }
spec:
  selector: { app: vllm }
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: vllm
  namespace: llm-serving
spec:
  to: { kind: Service, name: vllm }
  port: { targetPort: http }
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
