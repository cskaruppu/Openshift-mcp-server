# The dashboard is a STATELESS nginx pod serving the static React build.
# It holds no persistent state — all state lives in PostgreSQL (management
# plane). nginx only needs writable emptyDir mounts for /tmp, cache and run.
# (Previously carried a 50Gi PVC at /data that nothing ever wrote to.)
---
# Deployment named agentic-ai-* so all pods read as one product family.
# Service/Route keep the stable "mcp-dashboard" name — the dashboard URL
# (HUB_URL for every cluster's MCP server) must never change on a rename.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-ai-dashboard
  namespace: openshift-mcp
  labels:
    app.kubernetes.io/name: mcp-dashboard
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/part-of: tcs-agentic-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-dashboard
    spec:
      serviceAccountName: agentic-ai-server
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: quay.io/karuppucs/mcp-dashboard:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: nginx-tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
          readinessProbe:
            httpGet:
              path: /nginx-health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /nginx-health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
      volumes:
        - name: nginx-tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-dashboard
  namespace: openshift-mcp
  labels:
    app.kubernetes.io/name: mcp-dashboard
    app.kubernetes.io/part-of: tcs-agentic-ai
spec:
  selector:
    app.kubernetes.io/name: mcp-dashboard
  ports:
    - port: 8080
      targetPort: 8080
      name: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: mcp-dashboard
  namespace: openshift-mcp
  labels:
    app.kubernetes.io/name: mcp-dashboard
    app.kubernetes.io/part-of: tcs-agentic-ai
  annotations:
    haproxy.router.openshift.io/timeout: 600s
    haproxy.router.openshift.io/timeout-tunnel: 600s
spec:
  to:
    kind: Service
    name: mcp-dashboard
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
