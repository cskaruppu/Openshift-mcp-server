    verbs: ["get", "list"]

  # =====================================================================
  # Container image security scanners — read
  #   Trivy Operator (vendor-neutral) + Quay CSO / Clair (OpenShift).
  #   Enables the Image Vulnerability Scanner widget's "Live CVE" mode.
  #   See deploy/trivy-operator/ to install Trivy Operator.
  # =====================================================================
  - apiGroups: ["aquasecurity.github.io"]
    resources:
      - vulnerabilityreports
      - exposedsecretreports
      - configauditreports
      - rbacassessmentreports
      - infraassessmentreports
      - clustervulnerabilityreports
      - clusterconfigauditreports
      - clusterrbacassessmentreports
      - clustercompliancereports
      - sbomreports
      - clustersbomreports
    verbs: ["get", "list", "watch"]
  - apiGroups: ["secscan.quay.redhat.com"]
    resources:
      - imagemanifestvulns
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agentic-ai-server-remediator
rules:
  # Cluster version upgrade (patch desiredUpdate)
  - apiGroups: ["config.openshift.io"]
    resources:
      - clusterversions
    verbs: ["patch", "update"]
  # Pod delete (restart)
  - apiGroups: [""]
    resources:
      - pods
    verbs: ["delete"]
  # Patch deployments (scale, rollback)
  - apiGroups: ["apps"]
    resources:
      - deployments
      - deployments/scale
      - statefulsets/scale
    verbs: ["patch", "update"]
  # Cordon/drain nodes + evictions
  - apiGroups: [""]
    resources:
      - nodes
    verbs: ["patch", "update"]
  - apiGroups: [""]
    resources:
      - pods/eviction
    verbs: ["create"]
  # PVC resize
  - apiGroups: [""]
    resources:
      - persistentvolumeclaims
    verbs: ["patch", "update"]
  # CSR approval
  - apiGroups: ["certificates.k8s.io"]
    resources:
      - certificatesigningrequests/status
    verbs: ["update"]
  # InstallPlan approval
  - apiGroups: ["operators.coreos.com"]
    resources:
      - installplans
    verbs: ["patch", "update"]
  # Snapshot create
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources:
      - volumesnapshots
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agentic-ai-server-deployer
  labels:
    app.kubernetes.io/name: agentic-ai-server
    app.kubernetes.io/component: app-deployment-agent-rbac
# =====================================================================
# WRITE permissions for the Automation Hub · App Deployment Agent.
# Lets the agent CREATE/UPDATE the manifests it generates from a
# requirement document (namespace + workloads + networking + RBAC +
# quotas + monitoring). This is powerful (namespace + RBAC creation),
# so its binding below is OPT-IN — apply only if you want the App
# Deployment Agent to deploy to this cluster.
# =====================================================================
rules:
  # Cluster-scoped: create the target namespace
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create", "update", "patch"]
  # Core namespaced resources the agent deploys
  - apiGroups: [""]
    resources:
      - serviceaccounts
      - configmaps
      - secrets
      - services
      - persistentvolumeclaims
      - resourcequotas
      - limitranges
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  # Workloads
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  # Networking
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies", "ingresses"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  # Monitoring (ServiceMonitor)
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["servicemonitors", "podmonitors", "prometheusrules"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  # RBAC — create least-privilege Roles/RoleBindings for the app.
  # "escalate"/"bind" are required so the SA may create Roles/Bindings
  # that grant permissions (RBAC escalation-prevention check).
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "create", "update", "patch", "delete", "bind", "escalate"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agentic-ai-server-reader-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agentic-ai-server-reader
subjects:
  - kind: ServiceAccount
    name: agentic-ai-server
    namespace: openshift-mcp
  # The dashboard deployment runs as the "agentic-ai-agent" service account,
  # so it must also be bound to the reader role — otherwise reads that need
  # these rules (e.g. Trivy/Quay vulnerabilityreports) are denied at runtime.
  - kind: ServiceAccount
    name: agentic-ai-agent
    namespace: openshift-mcp
---
# Optional: only apply this binding if mutation/remediation is needed
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agentic-ai-server-remediator-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agentic-ai-server-remediator
subjects:
  - kind: ServiceAccount
    name: agentic-ai-server
    namespace: openshift-mcp
  - kind: ServiceAccount
    name: agentic-ai-agent
    namespace: openshift-mcp
---
# Optional: apply this binding to let the App Deployment Agent deploy to
# this cluster (create namespaces, workloads, networking, RBAC, monitoring).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agentic-ai-server-deployer-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agentic-ai-server-deployer
subjects:
  - kind: ServiceAccount
    name: agentic-ai-server
    namespace: openshift-mcp
  - kind: ServiceAccount
    name: agentic-ai-agent
    namespace: openshift-mcp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agentic-ai-server-virtualization
  labels:
    app.kubernetes.io/name: agentic-ai-server
    app.kubernetes.io/component: vm-lifecycle-rbac
# =====================================================================
# WRITE permissions for UC-06 · VM Lifecycle Agent.
# The reader role above can start, stop and inspect VMs; it cannot
# CREATE one. Provisioning also needs the DataVolume the VM's disk is
# built from, and the namespace when the operator asks for one to be
# created. Kept separate from the deployer role and OPT-IN via the
# binding below, so a cluster without OpenShift Virtualization — or a
# team that only wants read-only VM visibility — never grants it.
# =====================================================================
rules:
  # The VM itself, and the running instance it produces.
  - apiGroups: ["kubevirt.io"]
    resources:
      - virtualmachines
      - virtualmachineinstances
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Root disks. A dataVolumeTemplate makes the VM the owner, but the
  # agent still needs create/delete for provisioning and decommission.
  - apiGroups: ["cdi.kubevirt.io"]
    resources:
      - datavolumes
      - datavolumes/source
      - datasources
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Golden sizes and guest preferences — read only; the agent selects
  # from the catalogue, it never defines one.
  - apiGroups: ["instancetype.kubevirt.io"]
    resources:
      - virtualmachineclusterinstancetypes
      - virtualmachineclusterpreferences
      - virtualmachineinstancetypes
      - virtualmachinepreferences
    verbs: ["get", "list", "watch"]
  # Create the target namespace when the request opts in. Deliberately
  # no delete: this agent never removes a namespace.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create"]
---
# Optional: apply this binding to let the VM Lifecycle Agent provision
# virtual machines on this cluster. Without it, VM actions are limited
# to read, start, stop and restart.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agentic-ai-server-virtualization-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agentic-ai-server-virtualization
subjects:
  - kind: ServiceAccount
    name: agentic-ai-server
    namespace: openshift-mcp
  - kind: ServiceAccount
    name: agentic-ai-agent
    namespace: openshift-mcp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agentic-ai-server-migration
  labels:
    app.kubernetes.io/name: agentic-ai-server
    app.kubernetes.io/component: vm-migration-rbac
# =====================================================================
# UC-10 · VM Migration Agent — Migration Toolkit for Virtualization.
# Without this the agent cannot even SEE that MTV is installed: a 403 on
# forklift.konveyor.io is indistinguishable from the operator being
# absent unless you look at the status code. Read is what powers the
# readiness panel and VM discovery; write is only for Plans and
# Migrations, the two objects this agent creates.
# OPT-IN via the binding below — a cluster that does not migrate VMs
# never grants it.
# =====================================================================
rules:
  # Everything MTV defines: read, so readiness can report the truth.
  - apiGroups: ["forklift.konveyor.io"]
    resources:
      - forkliftcontrollers
      - providers
      - storagemaps
      - networkmaps
      - hosts
      - hooks
    verbs: ["get", "list", "watch"]
  # Plans and Migrations are what this agent creates, and must be able to
  # remove again — rollback deletes the plan and cancels the migration.
  - apiGroups: ["forklift.konveyor.io"]
    resources:
      - plans
      - migrations
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # The inventory service is reached by ClusterIP taken from the API
  # server, so the service object itself must be readable.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
---
# Optional: apply this binding to let the VM Migration Agent see and drive
# MTV on this cluster. Without it the readiness panel reports that it cannot
# read forklift.konveyor.io, and names this role as the fix.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agentic-ai-server-migration-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agentic-ai-server-migration
subjects:
  - kind: ServiceAccount
    name: agentic-ai-server
    namespace: openshift-mcp
  - kind: ServiceAccount
    name: agentic-ai-agent
    namespace: openshift-mcp
---
# ---------------------------------------------------------------------------
# Namespace-scoped write for the App Change Watcher's persistence ConfigMap.
# The watcher stores the user's tracked-namespace list in the ConfigMap
# "mcp-tracked-namespaces" in its own namespace so selections survive pod
# restarts. Least-privilege: create on configmaps (kube requires no resource
# name for create) + get/update/patch restricted to that single ConfigMap.
# ---------------------------------------------------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentic-ai-server-watcher-state
  namespace: openshift-mcp
  labels:
    app.kubernetes.io/name: agentic-ai-server
    app.kubernetes.io/component: app-change-watcher-rbac
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["mcp-tracked-namespaces"]
    verbs: ["get", "update", "patch"]
  # UC-10 · the migration assessment baseline. Drift ("what changed since the
  # last assessment") needs somewhere durable to keep the previous run, and the
  # cluster is already the thing that survives a pod restart. One fixed
  # ConfigMap holds every provider's baseline as separate keys, because
  # resourceNames takes no wildcard — a name per provider would mean granting
  # write on every ConfigMap in the namespace.
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["tcs-migration-assessments"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentic-ai-server-watcher-state
  namespace: openshift-mcp
  labels:
    app.kubernetes.io/name: agentic-ai-server
    app.kubernetes.io/component: app-change-watcher-rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agentic-ai-server-watcher-state
subjects:
  - kind: ServiceAccount
    name: agentic-ai-server
    namespace: openshift-mcp
