apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentic-ai-server
  namespace: openshift-mcp
  labels:
    app.kubernetes.io/name: agentic-ai-server
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agentic-ai-server-reader
rules:
  # =====================================================================
  # Core API — read
  # =====================================================================
  - apiGroups: [""]
    resources:
      - nodes
      - pods
      - pods/log
      - services
      - namespaces
      - events
      - resourcequotas
      - limitranges
      - configmaps
      - secrets
      - serviceaccounts
      - persistentvolumeclaims
      - persistentvolumes
      - endpoints
      - replicationcontrollers
    verbs: ["get", "list", "watch"]

  # =====================================================================
  # Apps — read
  # =====================================================================
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs: ["get", "list", "watch"]

  # =====================================================================
  # Batch — read
  # =====================================================================
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]

  # =====================================================================
  # Autoscaling — read
  # =====================================================================
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: ["get", "list", "watch"]

  # =====================================================================
  # OpenShift Config — read
  # =====================================================================
  - apiGroups: ["config.openshift.io"]
    resources:
      - clusterversions
      - clusteroperators
      - infrastructures
      - oauths
      - ingresses
      - networks
      - proxies
      - schedulers
      - apiservers
    verbs: ["get", "list"]

  # =====================================================================
  # OpenShift Build — read (Tier 1: builds & buildconfigs)
  # =====================================================================
  - apiGroups: ["build.openshift.io"]
    resources:
      - builds
      - buildconfigs
    verbs: ["get", "list", "watch"]

  # =====================================================================
  # OpenShift Image — read (Tier 1: imagestreams)
  # =====================================================================
  - apiGroups: ["image.openshift.io"]
    resources:
      - imagestreams
      - imagestreamtags
      - imagestreamimages
    verbs: ["get", "list", "watch"]

  # =====================================================================
  # OpenShift Apps — read (Tier 1: deploymentconfigs)
  # =====================================================================
  - apiGroups: ["apps.openshift.io"]
    resources:
      - deploymentconfigs
    verbs: ["get", "list", "watch"]

  # =====================================================================
  # OpenShift Project — read
  # =====================================================================
  - apiGroups: ["project.openshift.io"]
    resources:
      - projects
    verbs: ["get", "list"]

  # =====================================================================
  # OpenShift Template — read
  # =====================================================================
  - apiGroups: ["template.openshift.io"]
    resources:
      - templates
    verbs: ["get", "list"]

  # =====================================================================
  # OpenShift Machine API — read
  # =====================================================================
  - apiGroups: ["machine.openshift.io"]
    resources:
      - machines
      - machinesets
      - machinehealthchecks
    verbs: ["get", "list"]

  # =====================================================================
  # OpenShift MachineConfig — read (Tier 1)
  # =====================================================================
  - apiGroups: ["machineconfiguration.openshift.io"]
    resources:
      - machineconfigs
      - machineconfigpools
    verbs: ["get", "list"]

  # =====================================================================
  # Routes — read
  # =====================================================================
  - apiGroups: ["route.openshift.io"]
    resources:
      - routes
    verbs: ["get", "list"]

  # =====================================================================
  # OpenShift User / Identity — read (Tier 1: RBAC queries)
  # =====================================================================
  - apiGroups: ["user.openshift.io"]
    resources:
      - users
      - groups
      - identities
    verbs: ["get", "list"]

  # =====================================================================
  # OpenShift Quota — read
  # =====================================================================
  - apiGroups: ["quota.openshift.io"]
    resources:
      - clusterresourcequotas
    verbs: ["get", "list"]

  # =====================================================================
  # OpenShift OAuth — read
  # =====================================================================
  - apiGroups: ["oauth.openshift.io"]
    resources:
      - oauthclients
    verbs: ["get", "list"]

  # =====================================================================
  # OpenShift Operator — read
  # =====================================================================
  - apiGroups: ["operator.openshift.io"]
    resources:
      - ingresscontrollers
    verbs: ["get", "list"]

  # =====================================================================
  # OpenShift API Server — read
  # =====================================================================
  - apiGroups: ["apiserver.openshift.io"]
    resources:
      - apirequestcounts
    verbs: ["get", "list"]

  # =====================================================================
  # OpenShift Security — read (Tier 1: SCC)
  # =====================================================================
  - apiGroups: ["security.openshift.io"]
    resources:
      - securitycontextconstraints
    verbs: ["get", "list"]

  # =====================================================================
  # OLM (Operator Lifecycle Manager) — read (Tier 1)
  # =====================================================================
  - apiGroups: ["operators.coreos.com"]
    resources:
      - subscriptions
      - installplans
      - operatorgroups
      - clusterserviceversions
      - catalogsources
    verbs: ["get", "list", "watch"]
  - apiGroups: ["packages.operators.coreos.com"]
    resources:
      - packagemanifests
    verbs: ["get", "list"]

  # =====================================================================
  # RBAC — read (for security auditing)
  # =====================================================================
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - roles
      - rolebindings
      - clusterroles
      - clusterrolebindings
    verbs: ["get", "list"]

  # =====================================================================
  # Authorization — subject access review (who-can)
  # =====================================================================
  - apiGroups: ["authorization.k8s.io"]
    resources:
      - subjectaccessreviews
    verbs: ["create"]

  # =====================================================================
  # CRD / API extensions — read (Tier 1)
  # =====================================================================
  - apiGroups: ["apiextensions.k8s.io"]
    resources:
      - customresourcedefinitions
    verbs: ["get", "list"]

  # =====================================================================
  # API registration — read
  # =====================================================================
  - apiGroups: ["apiregistration.k8s.io"]
    resources:
      - apiservices
    verbs: ["get", "list"]

  # =====================================================================
  # Certificates — read (Tier 1: CSR)
  # =====================================================================
  - apiGroups: ["certificates.k8s.io"]
    resources:
      - certificatesigningrequests
    verbs: ["get", "list", "watch"]

  # =====================================================================
  # Scheduling — read (Tier 1: priority classes)
  # =====================================================================
  - apiGroups: ["scheduling.k8s.io"]
    resources:
      - priorityclasses
    verbs: ["get", "list"]

  # =====================================================================
  # Networking — read
  # =====================================================================
  - apiGroups: ["networking.k8s.io"]
    resources:
      - networkpolicies
      - ingresses
      - ingressclasses
    verbs: ["get", "list"]

  # =====================================================================
  # OpenShift Network — read (egress, OVN)
  # =====================================================================
  - apiGroups: ["network.openshift.io"]
    resources:
      - egressnetworkpolicies
    verbs: ["get", "list"]
  - apiGroups: ["k8s.ovn.org"]
    resources:
      - egressips
    verbs: ["get", "list"]
  - apiGroups: ["k8s.cni.cncf.io"]
    resources:
      - network-attachment-definitions
    verbs: ["get", "list"]

  # =====================================================================
  # Advanced Network Policy — read
  # =====================================================================
  - apiGroups: ["policy.networking.k8s.io"]
    resources:
      - adminnetworkpolicies
      - baselineadminnetworkpolicies
    verbs: ["get", "list"]

  # =====================================================================
  # Policy — read (PDB, PSP)
  # =====================================================================
  - apiGroups: ["policy"]
    resources:
      - poddisruptionbudgets
      - podsecuritypolicies
    verbs: ["get", "list"]

  # =====================================================================
  # Flow Control — read
  # =====================================================================
  - apiGroups: ["flowcontrol.apiserver.k8s.io"]
    resources:
      - flowschemas
      - prioritylevelconfigurations
    verbs: ["get", "list"]

  # =====================================================================
  # Admission Webhooks — read
  # =====================================================================
  - apiGroups: ["admissionregistration.k8s.io"]
    resources:
      - mutatingwebhookconfigurations
      - validatingwebhookconfigurations
    verbs: ["get", "list"]

  # =====================================================================
  # Storage — read (Tier 2: CSI, snapshots, storage classes)
  # =====================================================================
  - apiGroups: ["storage.k8s.io"]
    resources:
      - storageclasses
      - csidrivers
      - csinodes
      - csistoragecapacities
    verbs: ["get", "list"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources:
      - volumesnapshots
      - volumesnapshotclasses
      - volumesnapshotcontents
    verbs: ["get", "list"]

  # =====================================================================
  # Metrics API — read
  # =====================================================================
  - apiGroups: ["metrics.k8s.io"]
    resources:
      - nodes
      - pods
    verbs: ["get", "list"]

  # =====================================================================
  # KubeVirt — read + start/stop VMs
  # =====================================================================
  - apiGroups: ["kubevirt.io"]
    resources:
      - virtualmachines
      - virtualmachineinstances
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["subresources.kubevirt.io"]
    resources:
      - virtualmachines/start
      - virtualmachines/stop
      - virtualmachines/restart
    verbs: ["update"]

  # =====================================================================
  # Tekton — read + create pipeline runs
  # =====================================================================
  - apiGroups: ["tekton.dev"]
    resources:
      - pipelines
      - pipelineruns
      - tasks
      - taskruns
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: ["triggers.tekton.dev"]
    resources:
      - eventlisteners
      - triggerbindings
      - triggertemplates
      - triggers
    verbs: ["get", "list"]

  # =====================================================================
  # ArgoCD / GitOps — read + sync
  # =====================================================================
  - apiGroups: ["argoproj.io"]
    resources:
      - applications
      - appprojects
      - applicationsets
    verbs: ["get", "list", "watch", "patch"]

  # =====================================================================
  # Monitoring — Prometheus / Alertmanager — read
  # =====================================================================
  - apiGroups: ["monitoring.coreos.com"]
    resources:
      - prometheuses
      - alertmanagers
      - servicemonitors
      - prometheusrules
      - podmonitors
      - alertmanagerconfigs
      - thanosrulers
    verbs: ["get", "list"]

  # =====================================================================
  # Logging — read
  # =====================================================================
  - apiGroups: ["logging.openshift.io"]
    resources:
      - clusterlogforwarders
      - clusterloggings
    verbs: ["get", "list"]
  - apiGroups: ["loki.grafana.com"]
    resources:
      - lokistacks
    verbs: ["get", "list"]

  # =====================================================================
  # Tracing — read
  # =====================================================================
  - apiGroups: ["jaegertracing.io"]
    resources:
      - jaegers
    verbs: ["get", "list"]
  - apiGroups: ["tempo.grafana.com"]
    resources:
      - tempostacks
    verbs: ["get", "list"]

  # =====================================================================
  # Network Observability — read
  # =====================================================================
  - apiGroups: ["flows.netobserv.io"]
    resources:
      - flowcollectors
    verbs: ["get", "list"]

  # =====================================================================
  # Compliance Operator — read
  # =====================================================================
  - apiGroups: ["compliance.openshift.io"]
    resources:
      - compliancesuites
      - compliancescans
      - profiles
      - profilebundles
      - compliancecheckresults
    verbs: ["get", "list"]
  - apiGroups: ["fileintegrity.openshift.io"]
    resources:
      - fileintegrities
    verbs: ["get", "list"]

  # =====================================================================
  # Cert-Manager — read
  # =====================================================================
  - apiGroups: ["cert-manager.io"]
    resources:
      - certificates
      - certificaterequests
      - issuers
      - clusterissuers
    verbs: ["get", "list"]

  # =====================================================================
  # External Secrets / Sealed Secrets / Vault — read
  # =====================================================================
  - apiGroups: ["external-secrets.io"]
    resources:
      - externalsecrets
      - secretstores
      - clustersecretstores
    verbs: ["get", "list"]
  - apiGroups: ["bitnami.com"]
    resources:
      - sealedsecrets
    verbs: ["get", "list"]
  - apiGroups: ["secrets.hashicorp.com"]
    resources:
      - vaultauths
      - vaultstaticsecrets
    verbs: ["get", "list"]

  # =====================================================================
  # Policy Engines — Gatekeeper / Kyverno — read
  # =====================================================================
  - apiGroups: ["templates.gatekeeper.sh"]
    resources:
      - constrainttemplates
    verbs: ["get", "list"]
  - apiGroups: ["wgpolicyk8s.io"]
    resources:
      - policyreports
      - clusterpolicyreports
    verbs: ["get", "list"]
  - apiGroups: ["kyverno.io"]
    resources:
      - policies
      - clusterpolicies
    verbs: ["get", "list"]

  # =====================================================================
  # Storage — ODF / Ceph / NooBaa — read
  # =====================================================================
  - apiGroups: ["ceph.rook.io"]
    resources:
      - cephclusters
      - cephblockpools
      - cephfilesystems
      - cephobjectstores
    verbs: ["get", "list"]
  - apiGroups: ["ocs.openshift.io"]
    resources:
      - storageclusters
    verbs: ["get", "list"]
  - apiGroups: ["noobaa.io"]
    resources:
      - noobaas
    verbs: ["get", "list"]
  - apiGroups: ["objectbucket.io"]
    resources:
      - objectbuckets
    verbs: ["get", "list"]

  # =====================================================================
  # Velero / OADP — backup & DR
  # =====================================================================
  - apiGroups: ["velero.io"]
    resources:
      - backups
      - schedules
      - restores
      - backupstoragelocations
      - volumesnapshotlocations
      - podvolumebackups
      - deletebackuprequests
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: ["oadp.openshift.io"]
    resources:
      - dataprotectionapplications
    verbs: ["get", "list"]

  # =====================================================================
  # Multi-cluster — ACM / Hive / HyperShift — read
  # =====================================================================
  - apiGroups: ["cluster.open-cluster-management.io"]
    resources:
      - managedclusters
      - placements
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy.open-cluster-management.io"]
    resources:
      - policies
    verbs: ["get", "list"]
  - apiGroups: ["addon.open-cluster-management.io"]
    resources:
      - managedclusteraddons
    verbs: ["get", "list"]
  - apiGroups: ["apps.open-cluster-management.io"]
    resources:
      - placementrules
      - gitopsclusters
    verbs: ["get", "list"]
  - apiGroups: ["work.open-cluster-management.io"]
    resources:
      - manifestworks
    verbs: ["get", "list"]
  - apiGroups: ["hive.openshift.io"]
    resources:
      - clusterdeployments
      - clusterpools
      - clusterclaims
      - clusterimagesets
    verbs: ["get", "list"]
  - apiGroups: ["hypershift.openshift.io"]
    resources:
      - hostedclusters
      - nodepools
    verbs: ["get", "list"]

  # =====================================================================
  # Bare-metal & Assisted Installer — read
  # =====================================================================
  - apiGroups: ["metal3.io"]
    resources:
      - baremetalhosts
      - hostfirmwaresettings
    verbs: ["get", "list"]
  - apiGroups: ["agent-install.openshift.io"]
    resources:
      - infraenvs
      - agents
    verbs: ["get", "list"]
  - apiGroups: ["extensions.hive.openshift.io"]
    resources:
      - agentclusterinstalls
    verbs: ["get", "list"]

  # =====================================================================
  # Performance / Tuning — read
  # =====================================================================
  - apiGroups: ["performance.openshift.io"]
    resources:
      - performanceprofiles
    verbs: ["get", "list"]
  - apiGroups: ["tuned.openshift.io"]
    resources:
      - tuneds
    verbs: ["get", "list"]
  - apiGroups: ["nfd.openshift.io"]
    resources:
      - nodefeaturediscoveries
    verbs: ["get", "list"]

  # =====================================================================
  # OpenShift AI / RHODS — read
  # =====================================================================
  - apiGroups: ["datasciencecluster.opendatahub.io"]
    resources:
      - datascienceclusters
    verbs: ["get", "list"]
  - apiGroups: ["kubeflow.org"]
    resources:
      - notebooks
    verbs: ["get", "list"]
  - apiGroups: ["serving.kserve.io"]
    resources:
      - inferenceservices
      - servingruntimes
    verbs: ["get", "list"]

  # =====================================================================
  # SR-IOV / MetalLB — read
  # =====================================================================
  - apiGroups: ["sriovnetwork.openshift.io"]
    resources:
      - sriovnetworks
      - sriovnetworknodepolicies
    verbs: ["get", "list"]
  - apiGroups: ["metallb.io"]
    resources:
      - bgppeers
      - ipaddresspools
      - l2advertisements
      - bgpadvertisements
    verbs: ["get", "list"]

  # =====================================================================
  # Service Mesh / Istio — read
  # =====================================================================
  - apiGroups: ["networking.istio.io"]
    resources:
      - virtualservices
      - destinationrules
      - gateways
      - serviceentries
    verbs: ["get", "list"]
  - apiGroups: ["maistra.io"]
    resources:
      - servicemeshcontrolplanes
      - servicemeshmembers
      - servicemeshmemberrolls
    verbs: ["get", "list"]

  # =====================================================================
  # Helm — read
  # =====================================================================
  - apiGroups: ["helm.openshift.io"]
    resources:
