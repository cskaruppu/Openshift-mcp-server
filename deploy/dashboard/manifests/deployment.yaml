apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-ai-server
  namespace: openshift-mcp
  labels:
    app.kubernetes.io/name: agentic-ai-server
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: tcs-agentic-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agentic-ai-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentic-ai-server
    spec:
      serviceAccountName: agentic-ai-server
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      dnsPolicy: "None"
      dnsConfig:
        nameservers:
          - "172.30.0.10"
          - "10.131.19.154"
        searches:
          - "openshift-mcp.svc.cluster.local"
          - "svc.cluster.local"
          - "cluster.local"
        options:
          - name: timeout
            value: "5"
          - name: attempts
            value: "3"
          - name: ndots
            value: "5"
      containers:
        - name: agentic-ai-server
          image: quay.io/karuppucs/openshift-mcp-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: agentic-ai-server-config
            - secretRef:
                name: agentic-ai-server-secrets
          env:
            - name: NODE_EXTRA_CA_CERTS
              value: "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: mcp-postgres
                  key: POSTGRES_USER
                  optional: true
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: mcp-postgres
                  key: POSTGRES_PASSWORD
                  optional: true
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: mcp-postgres
                  key: POSTGRES_DB
                  optional: true
            - name: DATABASE_URL
              value: "postgres://$(PGUSER):$(PGPASSWORD)@mcp-postgres.openshift-mcp.svc.cluster.local:5432/$(PGDATABASE)"
            - name: NODE_OPTIONS
              value: "--max-old-space-size=768"
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        # STATELESS: all durable state lives in PostgreSQL (kv_store + tables).
        # /data is an ephemeral scratch dir kept only as a no-DB dev fallback.
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
