# TCS Agentic AI — Dashboard Nginx Configuration
# Serves React SPA at / and proxies API calls to MCP server.
#
# MCP_API_UPSTREAM is set via ConfigMap/env. The k8s service name is
# resolved by cluster DNS: mcp-server.<namespace>.svc.cluster.local:3000
#
# In OpenShift, the Route terminates TLS at the edge, so nginx only
# sees plain HTTP on port 8080.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip for React assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 256;

    # API proxy — forward to MCP server service
    # MCP_API_URL is injected at runtime via envsubst or hardcoded to service DNS
    location /api/ {
        proxy_pass         http://mcp-server:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering    off;
    }

    # SSE endpoint (MCP protocol)
    location /sse {
        proxy_pass         http://mcp-server:3000;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_read_timeout 600s;
        proxy_buffering    off;
        chunked_transfer_encoding on;
    }

    # MCP message endpoint
    location /message {
        proxy_pass         http://mcp-server:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # MCP agent routes
    location /mcp/ {
        proxy_pass         http://mcp-server:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_read_timeout 600s;
        proxy_buffering    off;
    }

    # Health/ready for k8s probes (dashboard pod)
    location /nginx-health {
        return 200 '{"status":"ok","component":"dashboard"}';
        add_header Content-Type application/json;
    }

    # SPA fallback — serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively
    location /assets/ {
        expires 1d;
        add_header Cache-Control "public, immutable";
    }
}
