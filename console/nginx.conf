# OpenShift-compatible Nginx configuration
# - pid file in /tmp (writable by any UID)
# - temp directories in /tmp (writable by any UID)
# - listens on 8080 (non-privileged port)
# - proxies /api/* and /sse to MCP server service

worker_processes auto;
pid /tmp/nginx.pid;
error_log /tmp/nginx-error.log warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Temp directories — must be writable by OpenShift's random UID
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    access_log /tmp/nginx-access.log;

    sendfile    on;
    tcp_nopush  on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 256;

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # API proxy — forward to MCP server K8s service
        location /api/ {
            proxy_pass         http://mcp-server:3000;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_buffering    off;
        }

        # SSE endpoint (MCP protocol / streaming)
        location /sse {
            proxy_pass         http://mcp-server:3000;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_read_timeout 600s;
            proxy_buffering    off;
            chunked_transfer_encoding on;
        }

        # MCP message endpoint
        location /message {
            proxy_pass         http://mcp-server:3000;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        # MCP agent routes
        location /mcp/ {
            proxy_pass         http://mcp-server:3000;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_read_timeout 600s;
            proxy_buffering    off;
        }

        # Intelligence / hub / other API paths
        location /intelligence/ {
            proxy_pass         http://mcp-server:3000;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_read_timeout 600s;
            proxy_buffering    off;
        }

        location /hub/ {
            proxy_pass         http://mcp-server:3000;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_read_timeout 600s;
            proxy_buffering    off;
        }

        location /healthz {
            proxy_pass         http://mcp-server:3000;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
        }

        location /readyz {
            proxy_pass         http://mcp-server:3000;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
        }

        # Health for the dashboard pod itself
        location /nginx-health {
            return 200 '{"status":"ok","component":"dashboard"}';
            add_header Content-Type application/json;
        }

        # SPA fallback — serve index.html for all non-file routes
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Cache static assets aggressively
        location /assets/ {
            expires 1d;
            add_header Cache-Control "public, immutable";
        }
    }
}
