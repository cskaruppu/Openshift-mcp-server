apiVersion: v1
kind: ServiceAccount
metadata:
  name: tcs-agentic-ai
  namespace: openshift-tcs-agentic
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tcs-agentic-ai-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-reader
subjects:
- kind: ServiceAccount
  name: tcs-agentic-ai
  namespace: openshift-tcs-agentic
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcs-agentic-ai
  namespace: openshift-tcs-agentic
  labels:
    app: tcs-agentic-ai
    app.kubernetes.io/name: tcs-agentic-ai
    app.kubernetes.io/part-of: tcs-agentic-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tcs-agentic-ai
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: tcs-agentic-ai
    spec:
      serviceAccountName: tcs-agentic-ai
      containers:
      - name: mcp-server
        image: your-registry/tcs-agentic-ai:latest
        ports:
        - containerPort: 3001
          name: http
          protocol: TCP
        envFrom:
        - secretRef:
            name: tcs-agentic-ai-secrets
        env:
        - name: PORT
          value: "3001"
        - name: NODE_ENV
          value: "production"
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3001
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: tcs-agentic-ai
  namespace: openshift-tcs-agentic
  labels:
    app: tcs-agentic-ai
spec:
  selector:
    app: tcs-agentic-ai
  ports:
  - port: 3001
    targetPort: 3001
    name: http
    protocol: TCP
  type: ClusterIP
