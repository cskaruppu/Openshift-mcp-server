apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-dashboard
  namespace: openshift-mcp
data:
  index.html: |
    <!-- Dashboard HTML is mounted from this ConfigMap.
         To update, replace the data with contents of dashboard/index.html -->
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-dashboard-nginx
  namespace: openshift-mcp
data:
  default.conf: |
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location /api/ {
            proxy_pass http://mcp-server.openshift-mcp.svc.cluster.local:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;
            proxy_buffering off;
            chunked_transfer_encoding on;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-dashboard
  namespace: openshift-mcp
  labels:
    app.kubernetes.io/name: mcp-dashboard
    app.kubernetes.io/component: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-dashboard
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:alpine
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: dashboard-html
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: dashboard-html
          configMap:
            name: mcp-dashboard
        - name: nginx-conf
          configMap:
            name: mcp-dashboard-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-dashboard
  namespace: openshift-mcp
spec:
  selector:
    app.kubernetes.io/name: mcp-dashboard
  ports:
    - port: 8080
      targetPort: 8080
      name: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: mcp-dashboard
  namespace: openshift-mcp
spec:
  to:
    kind: Service
    name: mcp-dashboard
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
