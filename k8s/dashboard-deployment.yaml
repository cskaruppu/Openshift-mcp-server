apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-dashboard-nginx
  namespace: openshift-mcp
data:
  default.conf.template: |
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Resolve upstream at request time, not startup.
        # NGINX_RESOLVER is injected via envsubst from the pod env var.
        # Find your cluster DNS IP: oc get svc dns-default -n openshift-dns -o jsonpath='{.spec.clusterIP}'
        resolver ${NGINX_RESOLVER} valid=30s ipv6=off;

        location /api/ {
            set $backend "http://mcp-server.openshift-mcp.svc.cluster.local:3000";
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;
            proxy_buffering off;
            chunked_transfer_encoding on;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-dashboard
  namespace: openshift-mcp
  labels:
    app.kubernetes.io/name: mcp-dashboard
    app.kubernetes.io/component: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-dashboard
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:alpine
          ports:
            - containerPort: 8080
              name: http
          env:
            # Cluster DNS ClusterIP — find with:
            #   oc get svc dns-default -n openshift-dns -o jsonpath='{.spec.clusterIP}'
            - name: NGINX_RESOLVER
              value: "172.30.0.10"
          volumeMounts:
            - name: dashboard-html
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-templates
              mountPath: /etc/nginx/templates
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: dashboard-html
          configMap:
            name: mcp-dashboard
        - name: nginx-templates
          configMap:
            name: mcp-dashboard-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-dashboard
  namespace: openshift-mcp
spec:
  selector:
    app.kubernetes.io/name: mcp-dashboard
  ports:
    - port: 8080
      targetPort: 8080
      name: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: mcp-dashboard
  namespace: openshift-mcp
spec:
  to:
    kind: Service
    name: mcp-dashboard
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
