apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-dashboard
  namespace: openshift-mcp
data:
  index.html: |
    <!-- Dashboard HTML is mounted from this ConfigMap.
         To update, replace the data with contents of dashboard/index.html -->
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-dashboard
  namespace: openshift-mcp
  labels:
    app.kubernetes.io/name: mcp-dashboard
    app.kubernetes.io/component: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-dashboard
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:alpine
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: dashboard-html
              mountPath: /usr/share/nginx/html
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: dashboard-html
          configMap:
            name: mcp-dashboard
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-dashboard
  namespace: openshift-mcp
spec:
  selector:
    app.kubernetes.io/name: mcp-dashboard
  ports:
    - port: 8080
      targetPort: 8080
      name: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: mcp-dashboard
  namespace: openshift-mcp
spec:
  to:
    kind: Service
    name: mcp-dashboard
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
