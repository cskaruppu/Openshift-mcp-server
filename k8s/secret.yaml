# WARNING: Replace placeholder values with actual credentials before applying.
# For production, use an ExternalSecret operator or Vault integration.
apiVersion: v1
kind: Secret
metadata:
  name: mcp-server-secrets
  namespace: openshift-mcp
type: Opaque
stringData:
  # ServiceNow
  SERVICENOW_INSTANCE: "https://your-instance.service-now.com"
  SERVICENOW_USERNAME: "admin"
  SERVICENOW_PASSWORD: "CHANGEME"
  # Ansible Automation Platform
  ANSIBLE_CONTROLLER_URL: "https://ansible-controller.apps.your-cluster.example.com"
  ANSIBLE_CONTROLLER_TOKEN: "CHANGEME"
  # Emergency webhook (Slack, Teams, etc.)
  EMERGENCY_NOTIFICATION_WEBHOOK: ""
  # LLM API Key (for OpenAI, Anthropic, etc.)
  LLM_API_KEY: ""
