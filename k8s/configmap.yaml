apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-server-config
  namespace: openshift-mcp
data:
  MCP_TRANSPORT: "sse"
  MCP_SERVER_PORT: "3000"
  LOG_LEVEL: "info"
  EMERGENCY_AUTO_FIX: "false"
  NODE_TLS_REJECT_UNAUTHORIZED: "0"
  # Authentication: "none" (default), "token" (set MCP_API_TOKEN in secrets), "oauth" (OpenShift SSO)
  AUTH_MODE: "none"
  # LLM Provider: "openai", "anthropic", "ollama", or "none" (built-in analysis)
  LLM_PROVIDER: "none"
  # LLM_API_URL: "https://api.openai.com"    # or Ollama URL, etc.
  # LLM_MODEL: "gpt-4"                       # or claude-sonnet-4-20250514, llama3, etc.
  # ---- Cache & DB (optional — falls back to stateless if unset) ----
  REDIS_URL: "redis://mcp-redis.openshift-mcp.svc.cluster.local:6379"
  CHAT_CACHE_TTL: "60"
  CONTEXT_CACHE_TTL: "30"
