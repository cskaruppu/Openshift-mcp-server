apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-server-config
  namespace: openshift-mcp
data:
  MCP_TRANSPORT: "sse"
  MCP_SERVER_PORT: "3000"
  LOG_LEVEL: "info"
  EMERGENCY_AUTO_FIX: "false"
  # Authentication: "none" (default), "token" (set MCP_API_TOKEN in secrets), "oauth" (OpenShift SSO)
  AUTH_MODE: "token"
  # LLM Provider: "azure", "openai", "anthropic", "ollama", or "none" (built-in analysis)
  LLM_PROVIDER: "azure"
  # LLM_API_URL: Azure OpenAI endpoint (e.g. https://<resource>.openai.azure.com)
  # LLM_MODEL: "gpt-4"
  # AZURE_OPENAI_DEPLOYMENT: deployment name in Azure portal
  # AZURE_OPENAI_API_VERSION: "2024-12-01-preview"
  # ---- Cache & DB (optional — falls back to stateless if unset) ----
  REDIS_URL: "redis://mcp-redis.openshift-mcp.svc.cluster.local:6379"
  CHAT_CACHE_TTL: "60"
  CONTEXT_CACHE_TTL: "30"
  # ---- HTTP Proxy (route LLM calls through a machine with stable Azure access) ----
  # Set to your ansiblejenkins or proxy host. Pod → proxy → Azure.
  # HTTPS_PROXY: "http://<ansiblejenkins-ip>:8888"
  # HTTP_PROXY: "http://<ansiblejenkins-ip>:8888"
  # NO_PROXY: ".svc,.svc.cluster.local,172.30.0.0/16,10.0.0.0/8,localhost"
