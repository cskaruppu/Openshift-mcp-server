# NetworkPolicy — controls ingress/egress for all pods in the namespace.
#
# Egress: allow-all so the MCP server can reach the Kubernetes API (port 6443),
# external LLM APIs (port 443), DNS (port 53), and internal services.
#
# Ingress: OpenShift router + intra-namespace traffic only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-allow-egress
  namespace: openshift-mcp
  labels:
    app.kubernetes.io/part-of: mcp-ai-assistant
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-allow-ingress
  namespace: openshift-mcp
  labels:
    app.kubernetes.io/part-of: mcp-ai-assistant
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
    - from:
        - podSelector: {}
