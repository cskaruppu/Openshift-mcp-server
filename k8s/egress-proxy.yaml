# Optional egress proxy for clusters where the pod network cannot reach
# external endpoints (Azure OpenAI, OpenAI, Anthropic, etc.) directly.
#
# This runs Squid with hostNetwork: true so it uses the node's network
# stack, which typically has internet access. The mcp-server connects
# to this proxy via the HTTPS_PROXY env var.
#
# After deploying:
#   1. Get the proxy service ClusterIP:
#      oc get svc mcp-egress-proxy -n openshift-mcp -o jsonpath='{.spec.clusterIP}'
#   2. Set HTTPS_PROXY in the mcp-server deployment:
#      oc set env deployment/mcp-server HTTPS_PROXY=http://<CLUSTER_IP>:3128 -n openshift-mcp
#   Or use deploy.sh which does this automatically.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-egress-proxy-config
  namespace: openshift-mcp
data:
  squid.conf: |
    # Minimal forward proxy for LLM API egress
    http_port 3128
    # Allow CONNECT to HTTPS ports only
    acl SSL_ports port 443
    acl CONNECT method CONNECT
    http_access deny CONNECT !SSL_ports
    # Allow from pod network
    acl localnet src 10.0.0.0/8
    acl localnet src 172.16.0.0/12
    http_access allow localnet
    http_access deny all
    # Minimal logging
    access_log none
    cache deny all
    # Timeouts
    connect_timeout 30 seconds
    read_timeout 120 seconds
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-egress-proxy
  namespace: openshift-mcp
  labels:
    app.kubernetes.io/name: mcp-egress-proxy
    app.kubernetes.io/component: network
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-egress-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-egress-proxy
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: squid
          image: docker.io/ubuntu/squid:latest
          ports:
            - containerPort: 3128
          volumeMounts:
            - name: config
              mountPath: /etc/squid/squid.conf
              subPath: squid.conf
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: mcp-egress-proxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-egress-proxy
  namespace: openshift-mcp
spec:
  selector:
    app.kubernetes.io/name: mcp-egress-proxy
  ports:
    - port: 3128
      targetPort: 3128
      name: proxy
