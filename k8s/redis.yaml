# Redis — query cache for the OpenShift MCP Server.
# Used to cache cluster context and chat replies with a short TTL so repeated
# user queries are answered without re-hitting the API server.
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-redis
  namespace: openshift-mcp
  labels:
    app.kubernetes.io/name: mcp-redis
spec:
  selector:
    app.kubernetes.io/name: mcp-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-redis
  namespace: openshift-mcp
  labels:
    app.kubernetes.io/name: mcp-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-redis
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: registry.redhat.io/rhel9/redis-7:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
              name: redis
          args:
            - "--maxmemory"
            - "128mb"
            - "--maxmemory-policy"
            - "allkeys-lru"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 192Mi
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 15
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
