apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  namespace: openshift-mcp
  labels:
    app.kubernetes.io/name: openshift-mcp-server
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: mcp-ai-assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openshift-mcp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openshift-mcp-server
    spec:
      serviceAccountName: mcp-server
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      dnsConfig:
        options:
          - name: timeout
            value: "5"
          - name: attempts
            value: "5"
          - name: ndots
            value: "2"
      containers:
        - name: mcp-server
          image: quay.io/your-org/openshift-mcp-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: mcp-server-config
            - secretRef:
                name: mcp-server-secrets
          env:
            - name: NODE_EXTRA_CA_CERTS
              value: "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: mcp-postgres
                  key: POSTGRES_USER
                  optional: true
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: mcp-postgres
                  key: POSTGRES_PASSWORD
                  optional: true
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: mcp-postgres
                  key: POSTGRES_DB
                  optional: true
            - name: DATABASE_URL
              value: "postgres://$(PGUSER):$(PGPASSWORD)@mcp-postgres.openshift-mcp.svc.cluster.local:5432/$(PGDATABASE)"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
