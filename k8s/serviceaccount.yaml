apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-server
  namespace: openshift-mcp
  labels:
    app.kubernetes.io/name: openshift-mcp-server
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp-server-reader
rules:
  # Core resources — read
  - apiGroups: [""]
    resources:
      - nodes
      - pods
      - pods/log
      - services
      - namespaces
      - events
      - resourcequotas
      - limitranges
      - configmaps
      - secrets
      - serviceaccounts
      - persistentvolumeclaims
      - persistentvolumes
      - endpoints
    verbs: ["get", "list", "watch"]
  # Apps — read
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs: ["get", "list", "watch"]
  # Batch — read
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]
  # OpenShift config — read
  - apiGroups: ["config.openshift.io"]
    resources:
      - clusterversions
      - clusteroperators
      - infrastructures
    verbs: ["get", "list"]
  # OpenShift machine API — read
  - apiGroups: ["machine.openshift.io"]
    resources:
      - machines
      - machinesets
    verbs: ["get", "list"]
  # Routes — read
  - apiGroups: ["route.openshift.io"]
    resources:
      - routes
    verbs: ["get", "list"]
  # KubeVirt — read + start/stop VMs
  - apiGroups: ["kubevirt.io"]
    resources:
      - virtualmachines
      - virtualmachineinstances
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["subresources.kubevirt.io"]
    resources:
      - virtualmachines/start
      - virtualmachines/stop
      - virtualmachines/restart
    verbs: ["update"]
  # Tekton — read + create pipeline runs
  - apiGroups: ["tekton.dev"]
    resources:
      - pipelines
      - pipelineruns
      - tasks
      - taskruns
    verbs: ["get", "list", "watch", "create"]
  # ArgoCD / GitOps — read + sync
  - apiGroups: ["argoproj.io"]
    resources:
      - applications
      - appprojects
    verbs: ["get", "list", "watch", "patch"]
  # RBAC — read (for security auditing)
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - roles
      - rolebindings
      - clusterroles
      - clusterrolebindings
    verbs: ["get", "list"]
  # Authorization — subject access review (who-can)
  - apiGroups: ["authorization.k8s.io"]
    resources:
      - subjectaccessreviews
    verbs: ["create"]
  # Networking — read (for security audit)
  - apiGroups: ["networking.k8s.io"]
    resources:
      - networkpolicies
      - ingresses
    verbs: ["get", "list"]
  # Pod security / disruption budget — read
  - apiGroups: ["policy"]
    resources:
      - poddisruptionbudgets
      - podsecuritypolicies
    verbs: ["get", "list"]
  # Metrics API — read (for resource usage)
  - apiGroups: ["metrics.k8s.io"]
    resources:
      - nodes
      - pods
    verbs: ["get", "list"]
  # Velero / OADP — backup & DR
  - apiGroups: ["velero.io"]
    resources:
      - backups
      - schedules
      - restores
      - backupstoragelocations
      - deletebackuprequests
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: ["oadp.openshift.io"]
    resources:
      - dataprotectionapplications
    verbs: ["get", "list"]
  # ACM managed clusters — read
  - apiGroups: ["cluster.open-cluster-management.io"]
    resources:
      - managedclusters
    verbs: ["get", "list", "watch"]
  # ACM policies — read
  - apiGroups: ["policy.open-cluster-management.io"]
    resources:
      - policies
    verbs: ["get", "list"]
  # OpenShift SCC — read (for SCC advisor)
  - apiGroups: ["security.openshift.io"]
    resources:
      - securitycontextconstraints
    verbs: ["get", "list"]
  # MachineConfigPool — read (for upgrade advisor)
  - apiGroups: ["machineconfiguration.openshift.io"]
    resources:
      - machineconfigpools
    verbs: ["get", "list"]
  # OpenShift Service Mesh / Istio — read
  - apiGroups: ["networking.istio.io"]
    resources:
      - virtualservices
      - destinationrules
      - gateways
      - serviceentries
    verbs: ["get", "list"]
  - apiGroups: ["maistra.io"]
    resources:
      - servicemeshcontrolplanes
      - servicemeshmembers
      - servicemeshmemberrolls
    verbs: ["get", "list"]
  # Helm releases — read
  - apiGroups: ["helm.openshift.io"]
    resources:
      - helmchartrepositories
    verbs: ["get", "list"]
  # Prometheus / monitoring — read
  - apiGroups: ["monitoring.coreos.com"]
    resources:
      - prometheuses
      - alertmanagers
      - servicemonitors
      - prometheusrules
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp-server-remediator
rules:
  # Pod delete (restart) + exec
  - apiGroups: [""]
    resources:
      - pods
    verbs: ["delete"]
  - apiGroups: [""]
    resources:
      - pods/exec
    verbs: ["create"]
  # Patch deployments (scale, rollback)
  - apiGroups: ["apps"]
    resources:
      - deployments
      - deployments/scale
    verbs: ["patch", "update"]
  # Cordon/drain nodes + evictions
  - apiGroups: [""]
    resources:
      - nodes
    verbs: ["patch", "update"]
  - apiGroups: [""]
    resources:
      - pods/eviction
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-server-reader-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mcp-server-reader
subjects:
  - kind: ServiceAccount
    name: mcp-server
    namespace: openshift-mcp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-server-remediator-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mcp-server-remediator
subjects:
  - kind: ServiceAccount
    name: mcp-server
    namespace: openshift-mcp
