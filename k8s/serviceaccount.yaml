apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-server
  namespace: openshift-mcp
  labels:
    app.kubernetes.io/name: openshift-mcp-server
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp-server-reader
rules:
  # Core resources — read
  - apiGroups: [""]
    resources:
      - nodes
      - pods
      - pods/log
      - services
      - namespaces
      - events
      - resourcequotas
      - limitranges
      - configmaps
      - persistentvolumeclaims
    verbs: ["get", "list", "watch"]
  # Apps — read
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs: ["get", "list", "watch"]
  # OpenShift config — read
  - apiGroups: ["config.openshift.io"]
    resources:
      - clusterversions
      - clusteroperators
      - infrastructures
    verbs: ["get", "list"]
  # Routes — read
  - apiGroups: ["route.openshift.io"]
    resources:
      - routes
    verbs: ["get", "list"]
  # ACM managed clusters — read
  - apiGroups: ["cluster.open-cluster-management.io"]
    resources:
      - managedclusters
    verbs: ["get", "list", "watch"]
  # ACM policies — read
  - apiGroups: ["policy.open-cluster-management.io"]
    resources:
      - policies
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp-server-remediator
rules:
  # Pod delete (restart)
  - apiGroups: [""]
    resources:
      - pods
    verbs: ["delete"]
  # Patch deployments (scale, rollback)
  - apiGroups: ["apps"]
    resources:
      - deployments
      - deployments/scale
    verbs: ["patch", "update"]
  # Cordon/drain nodes
  - apiGroups: [""]
    resources:
      - nodes
    verbs: ["patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-server-reader-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mcp-server-reader
subjects:
  - kind: ServiceAccount
    name: mcp-server
    namespace: openshift-mcp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-server-remediator-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mcp-server-remediator
subjects:
  - kind: ServiceAccount
    name: mcp-server
    namespace: openshift-mcp
