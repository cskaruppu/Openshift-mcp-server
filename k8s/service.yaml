apiVersion: v1
kind: Service
metadata:
  name: mcp-server
  namespace: openshift-mcp
  labels:
    app.kubernetes.io/name: openshift-mcp-server
    app.kubernetes.io/part-of: mcp-ai-assistant
spec:
  selector:
    app.kubernetes.io/name: openshift-mcp-server
  ports:
    - port: 3000
      targetPort: 3000
      name: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: mcp-server
  namespace: openshift-mcp
  labels:
    app.kubernetes.io/name: openshift-mcp-server
    app.kubernetes.io/part-of: mcp-ai-assistant
  annotations:
    # SSE / streaming chat requires longer timeouts and disabled response buffering.
    # Without these, HAProxy holds the entire SSE response until the connection closes,
    # making the chat appear stuck on "gathering" until page refresh.
    haproxy.router.openshift.io/timeout: 600s
    haproxy.router.openshift.io/timeout-tunnel: 600s
    haproxy.router.openshift.io/disable_cookies: "true"
    router.openshift.io/haproxy.health.check.interval: 5s
spec:
  to:
    kind: Service
    name: mcp-server
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
